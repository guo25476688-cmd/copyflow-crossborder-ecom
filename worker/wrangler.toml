name = "copyflow-api"
main = "src/index.js"
compatibility_date = "2026-09-19"

# 知识库语义检索：Vectorize 存向量，Workers AI (bge-m3) 生成 embedding
# 部署前先 `wrangler vectorize create copyflow-kb --dimensions=1024 --metric=cosine`
[[vectorize]]
binding = "VECTORIZE"
index_name = "copyflow-kb"

[ai]
binding = "AI"

# 生成历史记录（对应 PRD 里一直没做的"历史记录管理"）
# 部署前先 `wrangler d1 create copyflow-db`，把返回的 database_id 填在下面
[[d1_databases]]
binding = "DB"
database_name = "copyflow-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 每周一 03:00 UTC 自动刷新一次知识库（对应北京时间周一 11:00）
[triggers]
crons = ["0 3 * * 1"]
